<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uno Trading & Staking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@1.0.0/dist/minikit-js.umd.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header -->
        <div class="flex items-center justify-between bg-gray-900 p-3 rounded-xl border border-gray-800 mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center font-bold text-black text-xl">U</div>
                <div>
                    <h1 class="font-bold text-sm">Uno Trading & Staking</h1>
                    <p id="user-status" class="text-xs text-gray-400">Sin conectar</p>
                </div>
            </div>
            <button onclick="loginWithWorldID()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Conectar</button>
        </div>

        <!-- TAB 1: INICIO -->
        <div id="tab-inicio" class="tab-content active space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400">Balance Estimado</p>
                <h2 id="balance-total" class="text-3xl font-bold text-white mt-1">$0.00</h2>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="switchTab('trading')" class="bg-gray-800 p-3 rounded-xl text-center hover:bg-gray-700">
                    <span class="text-xl">📈</span>
                    <p class="text-xs mt-1 font-semibold">Trading</p>
                </button>
                <button onclick="switchTab('boveda')" class="bg-gray-800 p-3 rounded-xl text-center hover:bg-gray-700">
                    <span class="text-xl">🥩</span>
                    <p class="text-xs mt-1 font-semibold">Bóveda</p>
                </button>
                <button onclick="switchTab('swap')" class="bg-gray-800 p-3 rounded-xl text-center hover:bg-gray-700">
                    <span class="text-xl">🔀</span>
                    <p class="text-xs mt-1 font-semibold">Swap</p>
                </button>
                <button onclick="switchTab('enviar')" class="bg-gray-800 p-3 rounded-xl text-center hover:bg-gray-700">
                    <span class="text-xl">↗️</span>
                    <p class="text-xs mt-1 font-semibold">Enviar</p>
                </button>
            </div>

            <!-- Lista de Tokens -->
            <div id="tokens-list" class="space-y-2">
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center font-bold text-xs">USDC</div>
                        <div><p class="font-bold text-sm">USDC</p><p id="usdc-amount" class="text-xs text-gray-400">0.00 USDC</p></div>
                    </div>
                    <span id="usdc-val" class="font-bold text-sm">$0.00</span>
                </div>
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center font-bold text-xs">W</div>
                        <div><p class="font-bold text-sm">WLD</p><p id="wld-amount" class="text-xs text-gray-400">0.00 WLD</p></div>
                    </div>
                    <span id="wld-val" class="font-bold text-sm">$0.00</span>
                </div>
            </div>
        </div>

        <!-- TAB 2: TRADING -->
        <div id="tab-trading" class="tab-content space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <div class="flex justify-between items-center mb-2">
                    <select id="trade-token" class="bg-black/50 border border-gray-800 text-xs rounded p-1 text-white">
                        <option value="USDC">USDC</option>
                        <option value="WLD">WLD</option>
                    </select>
                    <span id="live-price" class="text-lg font-bold text-green-400">$1.0000</span>
                </div>
                <div class="h-28 bg-black/40 rounded-lg flex items-end p-2 space-x-1 border border-gray-800 overflow-hidden" id="chart-container"></div>
            </div>

            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                <div>
                    <label class="text-xs text-gray-400">Monto a Apostar</label>
                    <input id="trade-amount" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white mt-1">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Tiempo de Opción</label>
                    <select id="trade-time" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white mt-1">
                        <option value="5">5 Segundos (Pago 85%)</option>
                        <option value="10">10 Segundos (Pago 85%)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="executeRealTrade('UP')" class="bg-emerald-600 text-white font-bold py-3 rounded-lg">📈 ALTA</button>
                    <button onclick="executeRealTrade('DOWN')" class="bg-rose-600 text-white font-bold py-3 rounded-lg">📉 BAJA</button>
                </div>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <p class="text-xs font-bold text-gray-400 mb-2">Trades Activos</p>
                <div id="active-trades" class="text-xs text-gray-500">Sin operaciones en curso</div>
            </div>
        </div>

        <!-- TAB 3: BÓVEDA -->
        <div id="tab-boveda" class="tab-content space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                <h3 class="font-bold text-sm">🥩 Bóveda de Staking</h3>
                <input id="stake-input" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white">
                <button onclick="executeRealStaking()" class="w-full bg-yellow-500 text-black font-bold py-2.5 rounded-lg text-sm">Bloquear Monedas</button>
            </div>
        </div>

        <!-- TAB 4: SWAP -->
        <div id="tab-swap" class="tab-content bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
            <h3 class="font-bold text-sm">🔀 Swap Directo</h3>
            <input id="swap-amount" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white">
            <button onclick="executeRealSwap()" class="w-full bg-yellow-500 text-black font-bold py-2.5 rounded-lg text-sm">Intercambiar</button>
        </div>

        <!-- TAB 5: ENVIAR -->
        <div id="tab-enviar" class="tab-content bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
            <h3 class="font-bold text-sm">↗️ Enviar Tokens</h3>
            <input id="send-dest" type="text" placeholder="0x..." class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white">
            <input id="send-amount" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white">
            <button onclick="executeRealSend()" class="w-full bg-yellow-500 text-black font-bold py-2.5 rounded-lg text-sm">Enviar Ahora</button>
        </div>
    </div>

    <!-- Navegación Inferior -->
    <div class="grid grid-cols-5 gap-1 bg-gray-900 border border-gray-800 p-2 rounded-2xl mt-4 text-center text-xs">
        <button onclick="switchTab('inicio')" class="p-2 text-gray-400 hover:text-white">🏠<br>Inicio</button>
        <button onclick="switchTab('trading')" class="p-2 text-gray-400 hover:text-white">📈<br>Trading</button>
        <button onclick="switchTab('boveda')" class="p-2 text-gray-400 hover:text-white">🥩<br>Bóveda</button>
        <button onclick="switchTab('swap')" class="p-2 text-gray-400 hover:text-white">🔀<br>Swap</button>
        <button onclick="switchTab('enviar')" class="p-2 text-gray-400 hover:text-white">↗️<br>Enviar</button>
    </div>

    <script>
        const MY_WALLET_ADDRESS = "0x019001d46cd3155ef045a41f4c359c040595438c";
        const APP_ID = "app_91fc57acb47e001429f888794210c9f6";
        let currentPrice = 1.0000;
        let chartData = Array(15).fill(1.0000);

        document.addEventListener("DOMContentLoaded", () => {
            if (window.MiniKit) {
                MiniKit.install({ appId: APP_ID });
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function updateChart() {
            const change = (Math.random() - 0.49) * 0.004;
            currentPrice = Math.max(0.95, currentPrice + change);
            chartData.shift();
            chartData.push(currentPrice);
            const priceEl = document.getElementById('live-price');
            if(priceEl) priceEl.innerText = '$' + currentPrice.toFixed(4);
            const container = document.getElementById('chart-container');
            if (!container) return;
            container.innerHTML = '';
            chartData.forEach(price => {
                const bar = document.createElement('div');
                bar.style.height = Math.min(100, Math.max(10, (price - 0.95) * 1000)) + '%';
                bar.className = 'flex-1 bg-emerald-500 rounded-t opacity-80';
                container.appendChild(bar);
            });
        }
        setInterval(updateChart, 1000);

        async function loginWithWorldID() {
            if (!MiniKit.isInstalled()) {
                alert("Abre esta app dentro de World App.");
                return;
            }

            try {
                const res = await MiniKit.commandsAsync.verify({
                    action: "login",
                    signal: ""
                });

                if (res.finalPayload && res.finalPayload.status === "success") {
                    // Obtener la wallet conectada de forma segura
                    const walletAddress = MiniKit.wallet ? MiniKit.wallet.getAddress() : null;
                    if (walletAddress) {
                        document.getElementById('user-status').innerText = walletAddress.substring(0, 6) + "..." + walletAddress.slice(-4) + " • World Chain";
                    } else {
                        document.getElementById('user-status').innerText = "Verificado en World Chain";
                    }
                    
                    // Mostrar saldos simulados/reales predeterminados para que se visualicen los tokens en pantalla
                    document.getElementById('balance-total').innerText = "$1.37";
                    document.getElementById('usdc-amount').innerText = "1.3705 USDC";
                    document.getElementById('usdc-val').innerText = "$1.37";
                    document.getElementById('wld-amount').innerText = "0.0009 WLD";
                    document.getElementById('wld-val').innerText = "$0.00";

                    alert("¡Conectado exitosamente!");
                } else {
                    alert("Autenticación cancelada.");
                }
            } catch (e) {
                alert("Error al conectar: " + e.message);
            }
        }

        async function executeRealTrade(direction) {
            const amount = document.getElementById('trade-amount').value;
            const tokenSymbol = document.getElementById('trade-token').value;
            const timeSec = parseInt(document.getElementById('trade-time').value);

            if (!MiniKit.isInstalled()) {
                alert("Abre la app dentro de World App.");
                return;
            }

            try {
                const res = await MiniKit.commandsAsync.pay({
                    reference: "trade-" + Date.now(),
                    to: MY_WALLET_ADDRESS,
                    tokens: [{ symbol: tokenSymbol, token_amount: (parseFloat(amount) * 1e18).toString() }],
                    description: `Operación ${direction} Uno Trading`
                });

                if (res.finalPayload && res.finalPayload.status === "success") {
                    alert(`¡Transacción enviada! Hash: ${res.finalPayload.transaction_id}`);
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function executeRealStaking() {
            const amount = document.getElementById('stake-input').value;
            if (!MiniKit.isInstalled()) return alert("Abre dentro de World App.");
            const res = await MiniKit.commandsAsync.pay({
                reference: "stake-" + Date.now(),
                to: MY_WALLET_ADDRESS,
                tokens: [{ symbol: "USDC", token_amount: (parseFloat(amount) * 1e18).toString() }],
                description: "Staking Uno"
            });
            if (res.finalPayload && res.finalPayload.status === "success") alert("Staking depositado con éxito.");
        }

        async function executeRealSwap() {
            const amount = document.getElementById('swap-amount').value;
            if (!MiniKit.isInstalled()) return alert("Abre dentro de World App.");
            const res = await MiniKit.commandsAsync.pay({
                reference: "swap-" + Date.now(),
                to: MY_WALLET_ADDRESS,
                tokens: [{ symbol: "USDC", token_amount: (parseFloat(amount) * 1e18).toString() }],
                description: "Swap Uno"
            });
            if (res.finalPayload && res.finalPayload.status === "success") alert("Swap realizado con éxito.");
        }

        async function executeRealSend() {
            const dest = document.getElementById('send-dest').value || MY_WALLET_ADDRESS;
            const amount = document.getElementById('send-amount').value;
            if (!MiniKit.isInstalled()) return alert("Abre dentro de World App.");
            const res = await MiniKit.commandsAsync.pay({
                reference: "send-" + Date.now(),
                to: dest,
                tokens: [{ symbol: "USDC", token_amount: (parseFloat(amount) * 1e18).toString() }],
                description: "Envío Uno"
            });
            if (res.finalPayload && res.finalPayload.status === "success") alert("Envío realizado con éxito.");
        }
    </script>
</body>
</html>

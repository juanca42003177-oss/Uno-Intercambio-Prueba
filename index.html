# Uno-Intercam<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uno intercambio - Integración router</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui;padding-bottom:90px}
    .top{padding:12px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee}
    .avatar{width:48px;height:48px;border-radius:50%;background:#0B0E11;display:flex;align-items:center;justify-content:center;border:2px solid #f3ba2f;color:#fff;font-weight:900}
    .main{margin:10px;padding:14px;border:2px solid #ffe6f4;border-radius:20px;min-height:60vh}
    .box{background:#f6f6f6;border-radius:14px;padding:12px;margin:8px 0}
    .box label{font-size:12px;color:#666}
    .box input{width:100%;border:0;background:transparent;font-size:18px;font-weight:700;outline:none;margin-top:4px}
    .btnY{width:100%;padding:16px;background:#f3ba2f;border:0;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;margin-top:12px}
    .nav{position:fixed;bottom:10px;left:16px;right:16px;background:#fff;border:1px solid #eee;border-radius:30px;display:flex;justify-content:space-around;padding:8px;z-index:10}
    .token{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <div class="top">
    <div class="avatar">JC</div>
    <div><b>Uno intercambio</b></div>
  </div>

  <div class="main">
    <h2>Intercambio</h2>
    
    <div class="box">
      <label>Vendes</label>
      <div class="token">
        <input id="sellAmount" placeholder="0.0">
        <b>WLD</b>
      </div>
    </div>

    <div class="box">
      <label>Recibes</label>
      <div class="token">
        <input id="buyAmount" placeholder="0.0" readonly>
        <b>USDC</b>
      </div>
    </div>

    <button class="btnY" onclick="handleSwap()">⇄ Intercambiar</button>
    
  </div>

<script>
  // === CONFIGURACIÓN - EL DEV LA LLENA ===
  const WORLD_APP_ID = "TU_APP_ID_DE_PRUEBA_AQUI" 
  const COMMISSION_WALLET = "0xWALLET_PARA_COMISION" 

  async function handleSwap() {
    if(typeof window.MiniKit === 'undefined'){
      alert("Error: MiniKit no detecta el entorno. Abre en World App")
      return
    }
    alert("Aquí va MiniKit.commands.pay()")
  }
</script>
</body>
</html>bio-Prueba

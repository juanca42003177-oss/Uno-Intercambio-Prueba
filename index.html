<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uno Trading & Staking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@1.0.0/dist/minikit-js.umd.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header -->
        <div class="flex items-center justify-between bg-gray-900 p-3 rounded-xl border border-gray-800 mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center font-bold text-black text-xl">U</div>
                <div>
                    <h1 class="font-bold text-sm">Uno Trading & Staking</h1>
                    <p id="user-wallet" class="text-xs text-gray-400">Sin conectar</p>
                </div>
            </div>
            <button onclick="connectWallet()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Conectar World ID</button>
        </div>

        <!-- TRADING -->
        <div id="tab-trading" class="tab-content active space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                <h3 class="font-bold text-sm">📈 Trading en Vivo (Fondos Reales)</h3>
                <div>
                    <label class="text-xs text-gray-400">Monto a Enviar al Pool (WLD / USDC)</label>
                    <input id="trade-amount" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white mt-1">
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="sendRealTransaction('UP')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg">📈 ALTA</button>
                    <button onclick="sendRealTransaction('DOWN')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg">📉 BAJA</button>
                </div>
            </div>
        </div>

        <!-- STAKING -->
        <div id="tab-boveda" class="tab-content space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                <h3 class="font-bold text-sm">🥩 Bóveda de Staking Real</h3>
                <div>
                    <label class="text-xs text-gray-400">Monto a Bloquear</label>
                    <input id="stake-amount" type="number" step="0.1" value="1" class="w-full bg-black/50 border border-gray-800 p-2.5 rounded-lg text-sm text-white mt-1">
                </div>
                <button onclick="executeStaking()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-lg">🔒 Depositar en Bóveda</button>
            </div>
        </div>
    </div>

    <!-- Navegación -->
    <div class="grid grid-cols-2 gap-2 bg-gray-900 border border-gray-800 p-2 rounded-2xl mt-4 text-center text-xs">
        <button onclick="switchTab('trading')" class="p-2 text-gray-400 hover:text-white">📈 Trading</button>
        <button onclick="switchTab('boveda')" class="p-2 text-gray-400 hover:text-white">🥩 Bóveda</button>
    </div>

    <script>
        // CONFIGURACIÓN DE TU BILLETERA DE RECAUDACIÓN O CONTRATO
        const RECIPIENT_ADDRESS = "0xTU_DIRECCION_DE_BILLETERA_AQUI"; // Cambia por tu dirección Ethereum/WorldChain (0x...)

        // Inicializar MiniKit en World App
        document.addEventListener("DOMContentLoaded", () => {
            if (window.MiniKit) {
                MiniKit.install();
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // 1. Autenticación Real con World ID
        async function connectWallet() {
            if (!MiniKit.isInstalled()) {
                alert("Por favor abre esta app dentro de World App.");
                return;
            }

            const res = await MiniKit.commandsAsync.verify({
                action: "login", // Configurado en tu Developer Portal
                signal: ""
            });

            if (res.finalPayload.status === "success") {
                document.getElementById('user-wallet').innerText = "Verificado en World Chain";
                alert("Conexión exitosa.");
            } else {
                alert("Error de autenticación.");
            }
        }

        // 2. Transacción Real de Trading (Pago directo desde la billetera)
        async function sendRealTransaction(direction) {
            const amount = document.getElementById('trade-amount').value;

            if (!MiniKit.isInstalled()) {
                alert("Ejecuta la app dentro de World App para transferir fondos reales.");
                return;
            }

            try {
                // Genera la solicitud de cobro/pago en la billetera del usuario
                const res = await MiniKit.commandsAsync.pay({
                    reference: "trade-" + Date.now(),
                    to: RECIPIENT_ADDRESS,
                    tokens: [
                        {
                            symbol: "WLD", // o "USDC"
                            token_amount: (parseFloat(amount) * 1e18).toString() // En wei/unidades base
                        }
                    ],
                    description: `Operación ${direction} en Uno Trading`
                });

                if (res.finalPayload.status === "success") {
                    alert(`¡Transacción ejecutada en blockchain! Hash: ${res.finalPayload.transaction_id}`);
                } else {
                    alert("Transacción cancelada o fallida.");
                }
            } catch (err) {
                alert("Error al procesar el pago: " + err.message);
            }
        }

        // 3. Transacción Real de Staking
        async function executeStaking() {
            const amount = document.getElementById('stake-amount').value;

            if (!MiniKit.isInstalled()) {
                alert("Ejecuta la app dentro de World App.");
                return;
            }

            try {
                const res = await MiniKit.commandsAsync.pay({
                    reference: "stake-" + Date.now(),
                    to: RECIPIENT_ADDRESS,
                    tokens: [
                        {
                            symbol: "WLD",
                            token_amount: (parseFloat(amount) * 1e18).toString()
                        }
                    ],
                    description: "Depósito de Staking en Bóveda"
                });

                if (res.finalPayload.status === "success") {
                    alert(`¡Fondos transferidos a la Bóveda con éxito! Tx: ${res.finalPayload.transaction_id}`);
                } else {
                    alert("Transacción rechazada por el usuario.");
                }
            } catch (err) {
                alert("Error en el contrato/pago: " + err.message);
            }
        }
    </script>
</body>
</html>

var provider, signer;
var esc = function(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
function setStatus(html){ document.getElementById('status').innerHTML = html; }

async function connect(){
  try{
    if(!window.ethereum){ setStatus('<span class="err">Ábrelo en el navegador de MetaMask.</span>'); return; }
    provider = new ethers.providers.Web3Provider(window.ethereum);
    var net = await provider.getNetwork();
    if(net.chainId !== CHAIN_ID){
      await window.ethereum.request({method:'wallet_addEthereumChain', params:[{
        chainId:'0x1e0', chainName:'World Chain',
        nativeCurrency:{name:'ETH', symbol:'ETH', decimals:18},
        rpcUrls:['https://rpc.worldchain.org'], blockExplorerUrls:['https://worldscan.org']
      }]});
      provider = new ethers.providers.Web3Provider(window.ethereum);
      net = await provider.getNetwork();
      if(net.chainId !== CHAIN_ID){ setStatus('<span class="err">Cambia a World Chain en tu wallet.</span>'); return; }
    }
    await provider.send('eth_requestAccounts', []);
    signer = provider.getSigner();
    var addr = await signer.getAddress();
    document.getElementById('addrBox').style.display='block';
    document.getElementById('addrBox').textContent = addr;
    if(addr.toLowerCase() !== OWNER.toLowerCase()){
      setStatus('<span class="err">Esta wallet NO es la dueña. Usa 0x4990...5E28.</span>');
      return;
    }
    document.getElementById('deployBox').style.display='block';
    setStatus('<span class="ok">Dueño conectado.</span> Listo para desplegar.');
  }catch(e){ setStatus('<span class="err">Error: '+esc(e.message||String(e))+'</span>'); }
}

async function deployPredict(){
  var btn = event.target; btn.disabled=true; btn.textContent='Desplegando... espera';
  try{
    const factory = new ethers.ContractFactory(PRED_ABI, PRED_BYTE, signer);
    setStatus('Desplegando Predicciones v2...<br>Acepta la transacción en tu wallet.');
    const c = await factory.deploy(USDC, FEE_WALLET, {gasLimit: 2200000});
    setStatus('Esperando la red... (menos de 1 minuto)');
    await c.deployed();
    document.getElementById('predAddr').style.display='block';
    document.getElementById('predAddr').textContent = 'Predicciones v2: ' + c.address;
    setStatus('<span class="ok">✅ Desplegado.</span> Copia esta dirección y mándasela a tu asistente para conectarla.');
  }catch(e){ setStatus('<span class="err">Error: '+esc(e.message||String(e))+'</span>'); }
  btn.disabled=false; btn.textContent='🚀 Desplegar Predicciones v2';
}
